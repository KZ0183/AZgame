name: スマホ確認用 Web を公開

# 実機のブラウザから触って確認するための導線。
# Android でも iPhone でも、URL を開くだけで最新版を試せる。
on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
  workflow_dispatch:

# Pages への配信に必要な権限。
permissions:
  contents: read
  pages: write
  id-token: write

# 配信は同時に 1 つだけ。走行中のものは待たせ、古い待機はまとめて捨てる。
concurrency:
  group: pages
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  build:
    name: Web をビルド
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: ビルド
        # GitHub Pages はリポジトリ名のサブパス配下で配信されるため、
        # base-href を合わせないとアセットの解決に失敗する。
        run: flutter build web --release --base-href "/${GITHUB_REPOSITORY#*/}/"

      - name: 直接開かれた URL でも 404 にしない
        # Pages は 404 時に 404.html を返す。index.html を複製しておくと、
        # スマホでリロードやブックマークから開いても起動する。
        run: cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: 公開
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: 結果を表示
        # 失敗時こそ案内が要る。Pages の初回有効化を忘れていると 404 で落ちるが、
        # 既定ではこのステップ自体が飛ばされてしまい、何をすべきか分からない。
        if: always()
        run: |
          if [ -n "${{ steps.deployment.outputs.page_url }}" ]; then
            {
              echo '## スマホで開く'
              echo ''
              echo "**${{ steps.deployment.outputs.page_url }}**"
              echo ''
              echo 'この URL をスマホのブラウザで開くと、この時点の最新版を触れます。'
              echo 'ホーム画面に追加すると全画面で起動し、実機アプリに近い見え方になります。'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo '## 公開できませんでした'
              echo ''
              echo 'GitHub Pages が有効になっていない可能性が高いです。'
              echo ''
              echo '1. **Settings → Pages** を開く'
              echo '2. **Source** を **GitHub Actions** に変更して保存'
              echo '3. このワークフローを再実行する'
              echo ''
              echo '> private リポジトリで Pages を使うには GitHub Pro 以上のプランが要ります。'
              echo '> 無料プランのままなら、リポジトリを public にするか、'
              echo '> Android なら「Android APK を配布」ワークフローの Release から入れてください。'
              echo '> 詳しくは docs/testing-on-device.md を参照。'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
