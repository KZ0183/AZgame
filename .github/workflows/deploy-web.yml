name: スマホ確認用 Web を公開

# 実機のブラウザから触って確認するための導線。
# Android でも iPhone でも、URL を開くだけで最新版を試せる。
on:
  push:
    branches:
      - main
      - master
      - 'claude/**'
  workflow_dispatch:

# Pages への配信に必要な権限。
permissions:
  contents: read
  pages: write
  id-token: write

# 配信は同時に 1 つだけ。走行中のものは待たせ、古い待機はまとめて捨てる。
concurrency:
  group: pages
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.44.8

jobs:
  build:
    name: Web をビルド
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: ビルド
        # GitHub Pages はリポジトリ名のサブパス配下で配信されるため、
        # base-href を合わせないとアセットの解決に失敗する。
        run: flutter build web --release --base-href "/${GITHUB_REPOSITORY#*/}/"

      - name: 直接開かれた URL でも 404 にしない
        # Pages は 404 時に 404.html を返す。index.html を複製しておくと、
        # スマホでリロードやブックマークから開いても起動する。
        run: cp build/web/index.html build/web/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: 公開
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: 確認用 URL を表示
        run: |
          {
            echo '## スマホで開く'
            echo ''
            echo "**${{ steps.deployment.outputs.page_url }}**"
            echo ''
            echo 'この URL をスマホのブラウザで開くと、この時点の最新版を触れます。'
            echo 'ホーム画面に追加すると全画面で起動し、実機アプリに近い見え方になります。'
          } >> "$GITHUB_STEP_SUMMARY"
