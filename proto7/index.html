<title>ふたりの英雄 対応版</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* 縦一画面の卓。上から 相手のバー／相手のタワー・後衛・前衛／真ん中の帯／自分の前衛・後衛・タワー／自分のバー・手札・説明・ボタン */
:root {
  --bg: #1b2230;
  --panel: #252f40;
  --panel-2: #2f3a4e;
  --line: #3d4a61;
  --ink: #ede7d9;
  --muted: #9ba5b6;
  --brass: #d8b26a;
  --bad: #e2694f;
  --good: #7cc18a;
  --resp: #5ea3e8;
  --h-red: #e2694f;
  --h-gold: #e6c56f;
  --h-grey: #b9b3a6;
  --h-blue: #5ea3e8;
  --h-green: #73c08d;
  --f-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
button:focus-visible, [role="button"]:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
#app {
  height: 100%; max-width: 480px; margin: 0 auto; box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
  display: flex; flex-direction: column;
}
.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
h1, h2 { font-family: var(--f-display); font-weight: 800; margin: 0; text-wrap: balance; letter-spacing: .04em; }
.muted { color: var(--muted); }
.label { font-size: 11px; letter-spacing: .12em; color: var(--muted); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.c-red { --hc: var(--h-red); } .c-gold { --hc: var(--h-gold); } .c-grey { --hc: var(--h-grey); } .c-blue { --hc: var(--h-blue); } .c-green { --hc: var(--h-green); }

/* ボタン */
.btn { border: 1px solid var(--brass); background: var(--brass); color: var(--bg); font-weight: 700; border-radius: 10px; padding: 11px 14px; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--brass); }
.btn:disabled { opacity: .4; cursor: default; }
.mini { border: 1px solid var(--brass); background: transparent; color: var(--brass); border-radius: 8px; padding: 6px 10px; font-size: 12px; cursor: pointer; }
.mini.on, .mini.solid { background: var(--brass); color: var(--bg); font-weight: 700; }
.mini.solid.resp { background: var(--resp); border-color: var(--resp); }
.mini:disabled { border-color: var(--line); background: transparent; color: var(--muted); font-weight: 400; cursor: default; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { background: transparent; border: 0; padding: 7px 12px; cursor: pointer; color: var(--muted); font-size: 12px; }
.seg button[aria-pressed="true"] { background: var(--panel-2); color: var(--ink); font-weight: 700; box-shadow: inset 0 -2px 0 var(--brass); }
.foot { display: flex; gap: 8px; }
.foot .btn { flex: 1; }

/* 小さな札 */
.tag { display: inline-block; font-size: 9.5px; font-weight: 700; line-height: 15px; border-radius: 4px; padding: 0 4px; vertical-align: 1px; white-space: nowrap; }
.tag.resp { background: var(--resp); color: var(--bg); }
.tag.front { border: 1px solid var(--line); color: var(--muted); font-weight: 400; }
.tag.new { background: var(--brass); color: var(--bg); }

/* タイトル */
.title { justify-content: center; gap: 16px; }
.title header { text-align: center; }
.title h1 { font-size: 44px; color: var(--brass); }
.points { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.points li { background: var(--panel); border-radius: 10px; padding: 9px 12px; font-size: 13px; line-height: 1.6; }
.points li b { color: var(--brass); }
.settings { display: grid; gap: 8px; justify-items: start; }
.title .actions { display: grid; gap: 8px; }
.linkbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 4px; justify-self: center; font-size: 12px; }

/* ルールの画面 */
.rules-scroll { flex: 1; min-height: 0; overflow-y: auto; display: grid; gap: 10px; align-content: start; }
.rules-scroll section { background: var(--panel); border-radius: 10px; padding: 10px 14px; }
.rules-scroll h3 { margin: 0 0 4px; font-family: var(--f-display); font-size: 15px; color: var(--brass); }
.rules-scroll ul { margin: 0; padding-left: 1.2em; font-size: 12.5px; line-height: 1.7; }

/* ヒーロー選択 */
.pick-scroll { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.hero-pick { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--hc); border-radius: 10px; padding: 10px 12px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 5px; }
.hero-pick[aria-pressed="true"] { border-color: var(--brass); border-left-color: var(--hc); box-shadow: 0 0 0 1px var(--brass) inset; background: var(--panel-2); }
.hero-pick .hd { display: flex; align-items: baseline; gap: 8px; }
.hero-pick .hd b { font-family: var(--f-display); font-size: 18px; }
.hero-pick .st { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.hero-pick .order { margin-left: auto; font-size: 11px; color: var(--brass); }

/* カードの一覧（選択画面・ヒーローの詳細で共通） */
.clist { display: grid; gap: 3px; font-size: 11.5px; line-height: 1.55; color: var(--muted); }
.clist div b { color: var(--ink); }
.clist .sk b { color: var(--brass); }

/* 対戦：上下のバー */
.bar { display: flex; align-items: center; gap: 8px; background: var(--panel); border-radius: 10px; padding: 4px 12px; min-height: 26px; }
.bar .who { font-weight: 700; font-size: 13px; }
.bar.turn { box-shadow: 0 0 0 1px var(--tc) inset; }
.bar.me { --tc: var(--brass); }
.bar.opp { --tc: var(--bad); }
.bar .note { margin-left: auto; font-size: 11px; color: var(--muted); }
.mana { display: inline-flex; align-items: center; gap: 8px; }
.gems { display: inline-flex; gap: 5px; align-items: center; }
.gem { width: 11px; height: 11px; transform: rotate(45deg); border: 1.5px solid var(--brass); border-radius: 2px; box-sizing: border-box; background: var(--brass); box-shadow: 0 0 6px color-mix(in srgb, var(--brass) 55%, transparent); }
.gem.empty { background: transparent; border-color: var(--line); box-shadow: none; }
.mana b { font-family: var(--f-display); font-size: 17px; color: var(--brass); font-variant-numeric: tabular-nums; }

/* 盤面 */
.field { flex: 1 1 0; min-height: calc(34px * 2 + 28px + 56px * 4 + 4px * 6); position: relative; display: grid; gap: 4px;
  grid-template-rows: auto minmax(56px, 1fr) minmax(56px, 1fr) auto minmax(56px, 1fr) minmax(56px, 1fr) auto; border-radius: 12px; }
.field.act-me { background: linear-gradient(to bottom, transparent 50%, color-mix(in srgb, var(--brass) 7%, transparent) 50%); }
.field.act-opp { background: linear-gradient(to bottom, color-mix(in srgb, var(--bad) 7%, transparent) 50%, transparent 50%); }
.frow { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; min-height: 0; }
.cell { border: 1px dashed var(--line); border-radius: 10px; position: relative; min-height: 0; display: flex; }
.cell .slot { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); font-size: 10px; color: var(--line); letter-spacing: .2em; }

/* ヒーロー */
.hero { flex: 1; min-width: 0; border-radius: 10px; border: 1px solid var(--line); border-top: 3px solid var(--hc); background: var(--panel);
  padding: 4px 8px; display: flex; flex-direction: column; gap: 2px; cursor: pointer; position: relative; box-sizing: border-box; }
.hero.focus { border-color: var(--brass); border-top-color: var(--hc); box-shadow: 0 0 0 1px var(--brass) inset; }
.hero.target { box-shadow: 0 0 0 2px var(--bad) inset; }
.hero.target.ally { box-shadow: 0 0 0 2px var(--good) inset; }
.hero.ko { opacity: .45; border-style: dashed; }
.hero.hidden { border-top-color: var(--line); }
.hero.hidden .q { font-family: var(--f-display); font-size: 22px; color: var(--muted); margin: auto; }
.hero .nm { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.hero .nm b { font-family: var(--f-display); font-size: 14px; line-height: 1.2; }
.hero .nm .sk { margin-left: auto; font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hpbar { height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
.hpbar i { display: block; height: 100%; background: var(--good); }
.hpbar i.low { background: var(--bad); }
.hero .nums { display: flex; gap: 8px; align-items: center; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; overflow: hidden; }
.hero .nums > span { white-space: nowrap; }
.hero .nums b { color: var(--ink); font-size: 13px; }
.flags { display: flex; gap: 3px; overflow: hidden; }
.flags i { font-style: normal; font-size: 10px; padding: 0 5px; border-radius: 4px; line-height: 15px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.flags i.hot { border-color: var(--brass); color: var(--brass); }
.aim { position: absolute; right: 4px; bottom: 4px; max-width: 70%; font-size: 10px; border-radius: 5px; padding: 1px 5px; background: var(--bad); color: var(--bg); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 1; }

/* タワー */
.tower { position: relative; display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; column-gap: 8px;
  background: color-mix(in srgb, var(--brass) 8%, var(--panel)); border: 1px solid var(--line); border-radius: 10px; padding: 5px 10px; cursor: pointer; }
.tower > b { font-family: var(--f-display); font-size: 13px; }
.tower .hpbar { height: 7px; border-radius: 4px; }
.tower .tn { font-family: var(--f-display); font-weight: 800; font-size: 16px; font-variant-numeric: tabular-nums; }
.tower .tn small { font-size: 10px; color: var(--muted); }
.tower .ts { font-size: 10.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 1px 7px; white-space: nowrap; }
.tower.open { border-color: var(--bad); }
.tower.open .ts { color: var(--bad); border-color: var(--bad); font-weight: 700; }
.tower.target { box-shadow: 0 0 0 2px var(--bad) inset; }
.tower.focus { box-shadow: 0 0 0 1px var(--brass) inset; }
.tower .aim { bottom: auto; top: -9px; right: 10px; }

/* 真ん中の帯：どちらのターンか・フェーズ・残り時間 */
.turnline { position: relative; z-index: 3; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border-radius: 99px; overflow: hidden;
  border: 1px solid var(--tc); background: color-mix(in srgb, var(--tc) 16%, var(--bg)); font-size: 11px; }
.turnline.me { --tc: var(--brass); }
.turnline.opp { --tc: var(--bad); }
.turnline .tl-round { color: var(--muted); font-variant-numeric: tabular-nums; }
.turnline .tl-who { text-align: center; font-family: var(--f-display); font-weight: 800; font-size: 14px; color: var(--tc); letter-spacing: .08em; }
.turnline .tl-phase { font-size: 10.5px; padding: 1px 8px; border-radius: 99px; border: 1px solid var(--tc); white-space: nowrap; font-variant-numeric: tabular-nums; }
.turnline .tl-phase.hot { background: var(--tc); color: var(--bg); font-weight: 700; }
.turnline .tl-bar { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--tc); transition: width .2s linear; }
.turnline.low .tl-bar { background: var(--bad); }
.turnline.respond { --tc: var(--resp); }

/* ターン交代の表示 */
.turnban { position: absolute; left: 0; right: 0; top: 50%; transform: translateY(-50%); z-index: 6; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 14px 0; pointer-events: none;
  background: color-mix(in srgb, var(--bg) 80%, transparent); border-block: 2px solid var(--tc); animation: ban .5s ease-out both; }
.turnban.me { --tc: var(--brass); }
.turnban.opp { --tc: var(--bad); }
.turnban span { font-family: var(--f-display); font-weight: 800; font-size: 30px; color: var(--tc); letter-spacing: .12em; }
.turnban small { color: var(--muted); }
@keyframes ban { from { opacity: 0; transform: translateY(-50%) scaleY(.4); } to { opacity: 1; transform: translateY(-50%); } }

/* 矢印 */
.arrows { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 4; overflow: visible; }
.arrows line { stroke-width: 5; stroke-linecap: round; filter: drop-shadow(0 0 3px var(--bg)); }
.arrows line.live { stroke-dasharray: 10 6; animation: march .6s linear infinite; }
@keyframes march { to { stroke-dashoffset: -16; } }

/* 手札：ヒーローごとに2枚 */
.hand { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.hgroup { border-top: 3px solid var(--hc); border-radius: 8px; background: color-mix(in srgb, var(--panel) 60%, var(--bg)); padding: 3px 4px 4px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.hgroup.ko { opacity: .5; }
.hg-head { display: flex; align-items: baseline; gap: 6px; font-size: 11px; min-width: 0; }
.hg-head b { font-family: var(--f-display); font-size: 12px; }
.hg-next { margin-left: auto; color: var(--muted); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hg-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.card { position: relative; background: var(--panel); border: 1px solid var(--line); border-top: 3px solid var(--hc); border-radius: 8px; padding: 3px 6px 4px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.card[aria-pressed="true"] { border-color: var(--brass); border-top-color: var(--hc); background: var(--panel-2); box-shadow: 0 0 0 1px var(--brass) inset; }
.card.off { opacity: .4; }
.card .ch { display: flex; align-items: center; gap: 4px; min-width: 0; }
.card .cost { font-family: var(--f-display); font-weight: 800; color: var(--brass); }
.card .ch .tag { margin-left: auto; }
.card b { font-size: 12px; line-height: 1.25; overflow-wrap: anywhere; }
.card .tag.new { position: absolute; top: -8px; left: 4px; }
.responding .card:not(.off) { box-shadow: 0 0 0 2px var(--resp); }

/* 説明欄 */
.detail { background: var(--panel); border-radius: 10px; padding: 7px 12px; font-size: 12px; line-height: 1.6; min-height: 3.2em; max-height: 6.5em; overflow-y: auto; }
.detail.log { max-height: 9em; min-height: 5em; }
.detail .dh { display: flex; gap: 8px; align-items: baseline; }
.detail .dh b { color: var(--brass); }
.detail .dh .muted { margin-left: auto; font-size: 11px; font-variant-numeric: tabular-nums; }
.detail b.h { color: var(--brass); }
.detail .err { color: var(--bad); }
.detail ul { margin: 3px 0 0; padding-left: 1.1em; }
.detail li.why { list-style: none; margin-left: -1.1em; padding: 4px 8px; margin-block: 3px; border-radius: 6px; background: color-mix(in srgb, var(--brass) 12%, transparent); }
.whytag { display: inline-block; font-size: 10px; font-weight: 700; color: var(--bg); background: var(--brass); border-radius: 4px; padding: 0 5px; margin-right: 6px; letter-spacing: .1em; }
.detail .acts { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 2px; }
.act { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }

/* 演出 */
.pops { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; pointer-events: none; z-index: 2; }
.pop { font-family: var(--f-display); font-weight: 800; font-size: 26px; text-shadow: 0 0 6px var(--bg), 0 0 2px var(--bg); animation: pop .4s ease-out both; white-space: nowrap; }
.pop.dmg { color: var(--bad); }
.pop.heal { color: var(--good); }
.pop.label { font-family: var(--f-body); font-size: 12px; color: var(--bg); background: var(--brass); border-radius: 6px; padding: 2px 8px; text-shadow: none; }
@keyframes pop { from { opacity: 0; scale: .5; } to { opacity: 1; scale: 1; } }
.shake { animation: shake .45s ease-in-out; }
@keyframes shake { 0%, 100% { transform: none; } 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
.lunge-up { animation: lunge-up .5s ease-out; z-index: 3; }
.lunge-down { animation: lunge-down .5s ease-out; z-index: 3; }
@keyframes lunge-up { 35% { transform: translateY(-14px) scale(1.04); } }
@keyframes lunge-down { 35% { transform: translateY(14px) scale(1.04); } }

/* 結果 */
.overlay { position: fixed; inset: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 82%, transparent); display: flex; align-items: center; justify-content: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { width: 100%; max-width: 440px; max-height: 100%; overflow-y: auto; background: var(--panel); border: 1px solid var(--brass); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; box-sizing: border-box; text-align: center; }
.sheet h2 { font-size: 36px; }
.sheet h2.win { color: var(--brass); }
.sheet h2.lose { color: var(--bad); }
.sheet p { margin: 0; }

@media (prefers-reduced-motion: reduce) { .pop, .shake, .lunge-up, .lunge-down, .turnban, .arrows line.live { animation: none; } }
</style>

<div id="app"></div>

<script src="engine.js"></script>
<script>
(() => {
  const E = window.Engine;
  const H = E.HERO, C = E.CARD;
  const app = document.getElementById('app');
  const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
  const RESPOND_SECONDS = 5;

  // ── 保存 ──
  const store = {
    get(key) { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } },
    set(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch {} },
  };
  let team = (() => { const t = store.get('futari-team'); return t && !E.validateTeam(t).length ? t : { heroes: ['sword', 'saint'], front: 0 }; })();
  // timer = 1ターンの秒数（0 は時間制限なし）、auto = 処理の再生を自動で進めるか
  let settings = (() => { const v = store.get('futari-settings'); return v && [0, 30, 60].includes(v.timer) ? { timer: v.timer, auto: v.auto !== false } : { timer: 30, auto: true }; })();

  // ── 共通の部品 ──
  const skillTag = (sk) => `【${E.SKILL_COST}${sk.pos === 'front' ? '・前衛' : ''}】`;
  // ヒーローの固有スキルと4枚のカード
  const heroListHTML = (id) => {
    const sk = H[id].skill;
    return `<div class="clist">
      <div class="sk"><b>固有スキル「${esc(sk.name)}」</b>${skillTag(sk)}${sk.resp ? '<span class="tag resp">対応</span> ' : ''}${esc(sk.text)}</div>
      ${H[id].cards.map((cid) => { const c = C[cid]; return `<div><b>${esc(c.name)}</b>【${c.cost}${c.pos === 'front' ? '・前衛' : ''}】${c.resp ? '<span class="tag resp">対応</span> ' : ''}${esc(c.text)}</div>`; }).join('')}
    </div>`;
  };

  // ── タイトル ──
  function title() {
    app.innerHTML = `<section class="screen title">
      <header><h1>ふたりの英雄</h1><p class="muted">二人を選び、前と後ろに立たせて戦う。</p></header>
      <ul class="points">
        <li><b>相手のタワーを壊したら勝ち。</b>タワーへの攻撃は、前衛のヒーローが<b>ブロック</b>して代わりに受けられる</li>
        <li>自分のターンに<b>カード・固有スキル・移動</b>を1つずつ使う。カードは各ヒーロー2枚ずつ、決まった順番で巡回する</li>
        <li>相手が攻撃してきたら、残したマナで<b>対応</b>カードを割り込ませられる</li>
      </ul>
      <div class="settings">
        <div class="row"><span class="label">1ターンの時間</span><div class="seg">${[[30, '30秒'], [60, '60秒'], [0, 'なし']].map(([t, l]) => `<button data-timer="${t}" aria-pressed="${settings.timer === t}">${l}</button>`).join('')}</div></div>
        <div class="row"><span class="label">処理の再生</span><div class="seg">${[[true, '自動'], [false, '「次へ」で進める']].map(([a, l]) => `<button data-auto="${a}" aria-pressed="${settings.auto === a}">${l}</button>`).join('')}</div></div>
      </div>
      <div class="actions">
        <button class="btn" id="go">${H[team.heroes[0]].name}と${H[team.heroes[1]].name}で対戦</button>
        <button class="btn ghost" id="pick">ヒーローを選ぶ</button>
        <button class="linkbtn" id="rules">ルールを読む</button>
      </div>
    </section>`;
    const on = (id, fn) => { document.getElementById(id).onclick = fn; };
    on('go', start); on('pick', pick); on('rules', rules);
    app.querySelectorAll('[data-timer]').forEach((b) => b.onclick = () => { settings.timer = +b.dataset.timer; store.set('futari-settings', settings); title(); });
    app.querySelectorAll('[data-auto]').forEach((b) => b.onclick = () => { settings.auto = b.dataset.auto === 'true'; store.set('futari-settings', settings); title(); });
  }

  // ── ルール ──
  function rules() {

      <h2 style="font-size:24px">ルール</h2>
      <div class="rules-scroll">
        ${sec('勝ち方', [

          'タワーへの攻撃は、前衛のヒーローが<b>ブロック</b>できる。その攻撃はタワーではなく、ブロックしたヒーローに当たる',
          'ブロックはマナ不要。前衛1人につき、相手のターンに1回まで。ブロックしたヒーローは反撃しない',
          '前衛が空のタワーは無防備で、ブロックできない',
          `相手のヒーローを倒すと、相手のタワーにも${E.KO_TOWER}ダメージ`,
          `${E.MAX_ROUND}ラウンドで決まらなければ、タワーの残りHPで判定`,
        ])}
        ${sec('陣形', [
          'ヒーローは前衛か後衛に立つ。移動は無料で、1人1ターン1回',
          '前衛向けの攻撃は後衛に届かない。遠距離の攻撃は後衛にも届く',
          '倒されたヒーローは、自分のターンを1回休んでから後衛で復活する',
        ])}
        ${sec('ターンとマナ', [
          '交互にターンを行う。自分のターンには、カード・固有スキル・移動を1つずつ使い、「ターン終了」で渡す',
          'マナは自分のターンの始めに回復する（ラウンド数+1、最大6。最初のラウンドだけ先攻1・後攻3）',
          '使わずに残したマナは、相手のターンの対応に使える',
        ])}
        ${sec('カードの巡回', [
          '各ヒーローは4枚のカードを決まった順番で巡回させる。手札は各ヒーロー2枚',
          '使ったカードは列の最後へ回り、同じ場所に次のカードが入る',
          '巡回の順番は最初にシャッフルされ、相手には見えない。<b>相手が使ったカードを覚えれば、手札が読める</b>',
          '「前衛」の付いたカードとスキルは、そのヒーローが前衛にいるときだけ使える',
        ])}
        ${sec('固有スキル', [
          `巡回とは別に、各ヒーローが1ターン1回使える（${E.SKILL_COST}マナ）`,
          ...E.HEROES.map((h) => `${h.name}「${esc(h.skill.name)}」：${esc(h.skill.text)}`),
        ])}
        ${sec('対応とブロック', [
          '相手が攻撃してきたら、<span class="tag resp">対応</span>の付いたカードかスキル、またはタワーへの攻撃なら<b>ブロック</b>を1つ割り込ませられる。対応が先に処理される',
          '受付は5秒。対応できなくても同じだけ待つ（手札を読まれないように）',
          '対応への対応はない',
        ])}
      </div>
      <div class="foot"><button class="btn" id="back">戻る</button></div>
    </section>`;
    document.getElementById('back').onclick = title;
  }

  // ── ヒーロー選択 ──
  function pick() {
    const ok = !E.validateTeam(team).length;
    app.innerHTML = `<section class="screen">
      <div class="row"><h2 style="font-size:24px">ヒーローを選ぶ</h2><span class="muted" style="margin-left:auto">${team.heroes.length} / 2</span></div>
      <div class="pick-scroll">${E.HEROES.map((h) => {
        const i = team.heroes.indexOf(h.id);
        return `<button class="hero-pick c-${h.color}" aria-pressed="${i >= 0}" data-hero="${h.id}">
          <span class="hd"><b>${h.name}</b><span class="st">HP ${h.hp}</span>${i >= 0 ? `<span class="order">${team.front === i ? '最初は前衛' : '最初は後衛'}</span>` : ''}</span>
          ${heroListHTML(h.id)}</button>`;
      }).join('')}</div>
      ${team.heroes.length === 2 ? `<div class="row"><span class="label">最初に前衛に立つ</span>${team.heroes.map((id, i) => `<button class="mini${team.front === i ? ' on' : ''}" data-front="${i}">${H[id].name}</button>`).join('')}</div>` : ''}
      <div class="foot"><button class="btn ghost" id="back">戻る</button><button class="btn" id="go" ${ok ? '' : 'disabled'}>この二人で対戦</button></div>
    </section>`;
    app.querySelectorAll('[data-hero]').forEach((b) => b.onclick = () => {
      const id = b.dataset.hero;
      const y = app.querySelector('.pick-scroll').scrollTop;
      if (team.heroes.includes(id)) team.heroes = team.heroes.filter((x) => x !== id);
      else if (team.heroes.length < 2) team.heroes.push(id);
      else team.heroes = [team.heroes[1], id];
      if (team.front >= team.heroes.length) team.front = 0;
      pick();
      app.querySelector('.pick-scroll').scrollTop = y;
    });
    app.querySelectorAll('[data-front]').forEach((b) => b.onclick = () => { team.front = +b.dataset.front; pick(); });
    document.getElementById('back').onclick = () => { if (!E.validateTeam(team).length) store.set('futari-team', team); title(); };
    document.getElementById('go').onclick = () => { store.set('futari-team', team); start(); };
  }

  // ── 対戦の状態 ──
  // phase: mine = 自分のターンの入力 / respond = 相手の攻撃への対応 / wait = 相手が対応を考えている / play = 処理の再生
  let game = null, cpuTeam = null, play = null;
  let phase = 'play', deadline = 0, total = 0, tick = null, autoTimer = null, waitTimer = null, myRemain = 0;
  // 自分のターンの選択：sel = 手札の uid、mode = 'skill'（固有スキルの対象選び）、focus = 見ているヒーロー {p,k}、ptarget = 選んだ対象
  let sel = null, mode = null, focus = null, ptarget = null;
  // 対応の選択：rsel = 手札の uid、rtarget = 対象の味方
  let rsel = null, rtarget = null;

  const me = () => game.players[0];
  const myCard = (uid) => { const f = uid != null && E.findCard(game, 0, uid); return f ? f.c : null; };
  const targetName = (p, k) => k === E.TOWER ? `${p === 0 ? 'あなた' : '相手'}のタワー`
    : p === 1 && !game.players[1].heroes[k].revealed ? '？？？' : `${p === 0 ? 'あなた' : '相手'}の${H[game.players[p].heroes[k].id].name}`;
  const clearPick = () => { sel = null; mode = null; focus = null; ptarget = null; };

  function start() {
    if (E.validateTeam(team).length) return pick();
    cpuTeam = E.CPU_TEAMS[Math.floor(Math.random() * E.CPU_TEAMS.length)];
    game = E.newGame([structuredClone(team), structuredClone(cpuTeam)], ['あなた', '相手']);
    playback(game.steps.slice(), afterTurnStart);
  }

  function stopTimers() { clearInterval(tick); clearTimeout(autoTimer); clearTimeout(waitTimer); tick = autoTimer = waitTimer = null; }

  // 時計：sec 秒後に onEnd。真ん中の帯に残り時間を出す
  function startClock(sec, onEnd, full) {
    clearInterval(tick);
    deadline = sec ? Date.now() + sec * 1000 : 0;
    total = (full || sec) * 1000;
    if (!deadline) return;
    tick = setInterval(() => {
      if (Date.now() >= deadline) { clearInterval(tick); tick = null; deadline = 0; onEnd(); return; }
      paintClock();
    }, 200);
  }
  function paintClock() {
    const el = app.querySelector('.turnline');
    if (!el || !deadline) return;
    const left = Math.max(0, deadline - Date.now());
    const s = el.querySelector('.tl-sec'); if (s) s.textContent = Math.ceil(left / 1000);
    const b = el.querySelector('.tl-bar'); if (b) b.style.width = `${left / total * 100}%`;
    el.classList.toggle('low', left <= (total > 6000 ? 10000 : 2000));
  }

  function afterTurnStart() {
    if (game.over) return finishGame();
    if (game.active === 0) beginMine(); else cpuNext();
  }

  // ── 自分のターン ──
  function beginMine() {
    stopTimers();
    phase = 'mine'; clearPick();
    startClock(settings.timer, endMyTurn);
    render();
  }
  // 行動する。攻撃なら相手の対応を待つ（CPU は約1秒考える）
  function doMine(a) {
    const r = E.act(game, 0, a);
    if (r.error) return;
    clearPick();
    myRemain = deadline ? deadline - Date.now() : 0; // 処理を見ているあいだは時計を止める
    const steps = game.steps.slice();
    if (!r.waiting) return playback(steps, resumeMine);
    phase = 'wait';
    playback(steps, () => {
      phase = 'wait'; render();
      waitTimer = setTimeout(() => {
        E.respond(game, 1, E.cpuResponse(game, 1));
        playback(game.steps.slice(), resumeMine);
      }, 900 + Math.random() * 500);
    });
  }
  function resumeMine() {
    if (game.over) return finishGame();
    stopTimers();
    phase = 'mine';
    if (settings.timer) startClock(Math.max(1, myRemain / 1000), endMyTurn, settings.timer); else deadline = 0;
    render();
  }
  function endMyTurn() {
    if (phase !== 'mine') return;
    stopTimers(); deadline = 0;
    playback(E.endTurn(game).slice(), afterTurnStart);
  }

  // ── 相手のターン ──
  function cpuNext() {
    if (game.over) return finishGame();
    const a = E.cpuAction(game, 1);
    if (!a) return playback(E.endTurn(game).slice(), afterTurnStart);
    const r = E.act(game, 1, a);
    playback(game.steps.slice(), r.waiting ? beginRespond : cpuNext);
  }
  // 対応の受付：対応できるかどうかに関係なく、決まった時間だけ待つ
  function beginRespond() {
    stopTimers();
    phase = 'respond'; rsel = null; rtarget = null; focus = null;
    startClock(RESPOND_SECONDS, () => sendResponse(null));
    render();
  }
  function sendResponse(resp) {
    if (phase !== 'respond') return;
    stopTimers(); deadline = 0;
    E.respond(game, 0, resp);
    phase = 'play';
    playback(game.steps.slice(), cpuNext);
  }

  // ── 処理の再生 ──
  function playback(steps, after) {
    stopTimers();
    if (phase !== 'wait') phase = 'play';
    play = { steps, i: 0, after };
    if (!steps.length) { play = null; return after(); }
    showStep();
  }
  function showStep() {
    const st = play.steps[play.i];
    render();
    clearTimeout(autoTimer);
    if (!settings.auto) return;
    const whys = st.lines.filter((l) => l.startsWith('※')).length;
    const base = st.title.startsWith('攻撃の宣言') ? 1500 : st.title.endsWith('のターン') ? 1100 : 1300;
    autoTimer = setTimeout(advance, base + whys * 1400);
  }
  function advance() {
    clearTimeout(autoTimer);
    if (!play) return;
    if (play.i < play.steps.length - 1) { play.i++; return showStep(); }
    const after = play.after;
    play = null;
    if (game.over) return finishGame();
    after();
  }
  function skipAll() {
    clearTimeout(autoTimer);
    play.i = play.steps.length - 1;
    render();
    if (settings.auto) autoTimer = setTimeout(advance, 700);
  }
  function finishGame() { phase = 'play'; render(); result(); }

  // ── 盤面の部品 ──
  function popsHTML(list) {
    if (!list.length) return '';
    return `<span class="pops">${list.map((h) => {
      let s = '';
      if (h.n != null && (h.n !== 0 || !h.label)) s += `<span class="pop ${h.heal ? 'heal' : 'dmg'}">${h.heal ? '+' : ''}${h.n}</span>`;
      if (h.label) s += `<span class="pop label">${esc(h.label)}</span>`;
      return s;
    }).join('')}</span>`;
  }

  function heroHTML(v, p, k, ctx) {
    const h = v.players[p].heroes[k];
    const def = H[h.id];
    const hits = ctx.hits.filter((x) => x.p === p && x.k === k);
    const marks = ctx.marks[p][k];
    const cls = ['hero', `c-${def.color}`,
      focus && focus.p === p && focus.k === k ? 'focus' : '',
      ctx.targets.some((t) => t.p === p && t.k === k) ? (p === 0 ? 'target ally' : 'target') : '',
      h.ko ? 'ko' : '', hits.some((x) => x.hit) ? 'shake' : '',
      ctx.actor && ctx.actor.p === p && ctx.actor.k === k ? (p === 0 ? 'lunge-up' : 'lunge-down') : ''].filter(Boolean);
    const aim = marks.length ? `<span class="aim">${marks.map(esc).join('・')}</span>` : '';
    if (p === 1 && !h.revealed && !game.over) {
      return `<div class="${cls.join(' ')} hidden" data-hero="${p}-${k}" role="button" tabindex="0" aria-label="正体不明の後衛"><span class="q">？？？</span>${aim}${popsHTML(hits)}</div>`;
    }
    const flags = [];
    if (h.ko) flags.push(['', `倒れている・あと${(h.wait || 0) + 1}ターン`]);
    if (h.taunt) flags.push(['hot', '挑発']);
    if (h.guard != null) flags.push(['hot', 'かばわれ中']);
    if (h.focus) flags.push(['hot', `次の攻撃+${h.focus}`]);
    if (p === v.active && !h.ko) { if (h.attacked) flags.push(['', 'スキル済']); if (h.moved) flags.push(['', '移動済']); }
    if (p !== v.active && h.blocked) flags.push(['', 'ブロック済']);
    const pct = Math.max(0, h.hp / h.maxHp * 100);
    return `<div class="${cls.join(' ')}" data-hero="${p}-${k}" role="button" tabindex="0" aria-label="${p === 0 ? 'あなた' : '相手'}の${def.name}">
      <span class="nm"><b>${def.name}</b><span class="sk">${esc(def.skill.name)}</span></span>
      <span class="hpbar"><i class="${pct <= 50 ? 'low' : ''}" style="width:${pct}%"></i></span>
      <span class="nums"><span>HP <b>${h.hp}</b>/${h.maxHp}</span>${h.shield ? `<span>盾 <b>${h.shield}</b></span>` : ''}${flags.length ? `<span class="flags">${flags.map(([c, t]) => `<i class="${c}">${t}</i>`).join('')}</span>` : ''}</span>
      ${aim}${popsHTML(hits)}</div>`;
  }

  function towerHTML(v, p, ctx) {
    const pl = v.players[p];
    const hits = ctx.hits.filter((x) => x.p === p && x.k === E.TOWER);
    const marks = ctx.marks[p][E.TOWER];
    const pct = Math.max(0, pl.tower / E.TOWER_HP * 100);
    const state = !pl.defended ? '無防備！' : `ブロック${pl.blockers}`;
    const cls = ['tower', pl.defended ? '' : 'open',
      ctx.targets.some((t) => t.p === p && t.k === E.TOWER) ? 'target' : '',
      focus && focus.p === p && focus.k === E.TOWER ? 'focus' : '', hits.some((x) => x.hit) ? 'shake' : ''].filter(Boolean);
    return `<div class="${cls.join(' ')}" data-hero="${p}-${E.TOWER}" role="button" tabindex="0" aria-label="${p === 0 ? 'あなた' : '相手'}のタワー">
      <b>${p === 0 ? 'あなた' : '相手'}のタワー</b>
      <span class="hpbar"><i class="${pct <= 40 ? 'low' : ''}" style="width:${pct}%"></i></span>
      <span class="tn">${Math.max(0, pl.tower)}<small>/${E.TOWER_HP}</small></span>
      <span class="ts">${state}</span>
      ${marks.length ? `<span class="aim">${marks.map(esc).join('・')}</span>` : ''}${popsHTML(hits)}</div>`;
  }

  // 今の状態で狙える相手
  function currentTargets() {
    const foes = () => [0, 1].filter((k) => !game.players[1].heroes[k].ko).map((k) => ({ p: 1, k })).concat([{ p: 1, k: E.TOWER }]);
    const allies = (except) => [0, 1].filter((k) => !me().heroes[k].ko && k !== except).map((k) => ({ p: 0, k }));
    if (phase === 'respond') return rsel && C[myCard(rsel).id].target === 'ally' ? allies() : [];
    if (phase !== 'mine') return [];
    if (mode === 'skill' && focus) {
      const sk = H[me().heroes[focus.k].id].skill;
      return sk.target === 'ally' ? allies(sk.resp ? focus.k : null) : foes();
    }
    if (sel) {
      const def = C[myCard(sel).id];
      if (def.id === 'rg_trip') return [0, 1].filter((k) => !game.players[1].heroes[k].ko && game.players[1].heroes[k].pos === 'front').map((k) => ({ p: 1, k }));
      if (def.target === 'front' || def.target === 'any') return foes();
      if (def.target === 'ally') return allies();
    }
    return [];
  }

  // 盤面の札：相手の攻撃の行き先（対応中）か、自分が選んだ対象
  function boardMarks() {
    const marks = [[[], [], []], [[], [], []]];
    const pd = game.pending;
    if (pd && (phase === 'respond' || phase === 'wait')) {
      const nm = H[game.players[pd.p].heroes[pd.k].id].name;
      const label = pd.type === 'card' ? `${nm}の${C[pd.id].name}` : `${nm}の${H[game.players[pd.p].heroes[pd.k].id].skill.name}`;
      if (pd.target != null) marks[1 - pd.p][pd.target].push(label);
      else if (pd.type === 'card' && pd.id === 'mg_flame') [0, 1].forEach((k) => { if (game.players[1 - pd.p].heroes[k].pos === 'front') marks[1 - pd.p][k].push(label); });
    }
    if (phase === 'mine' && (sel || mode) && ptarget) marks[ptarget.p][ptarget.k].push('ここを狙う');
    return marks;
  }

  // 矢印：{ from: {p,k}, to: {p,k}, kind: 'foe' | 'mine' | 'ally' }
  function arrowList(st) {
    if (st) return st.actor && st.aim ? st.aim.map((to) => ({ from: st.actor, to, kind: st.actor.p === 1 ? 'foe' : 'mine' })) : [];
    const pd = game.pending;
    if (pd && (phase === 'respond' || phase === 'wait')) {
      const tos = pd.target != null ? [pd.target]
        : pd.type === 'card' && pd.id === 'mg_flame' ? [0, 1].filter((x) => !game.players[1 - pd.p].heroes[x].ko && game.players[1 - pd.p].heroes[x].pos === 'front') : [];
      return tos.map((k) => ({ from: { p: pd.p, k: pd.k }, to: { p: 1 - pd.p, k }, kind: pd.p === 1 ? 'foe' : 'mine' }));
    }
    if (phase === 'mine' && ptarget) {
      const k = mode === 'skill' && focus ? focus.k : sel ? E.cardHero(game, 0, myCard(sel).id) : null;
      if (k == null || (ptarget.p === 0 && ptarget.k === k)) return [];
      return [{ from: { p: 0, k }, to: ptarget, kind: ptarget.p === 0 ? 'ally' : 'mine' }];
    }
    return [];
  }
  function drawArrows(list) {
    const field = app.querySelector('.field');
    if (!field || !list.length) return;
    const fr = field.getBoundingClientRect();
    const color = { foe: 'var(--bad)', mine: 'var(--brass)', ally: 'var(--good)' };
    const defs = Object.entries(color).map(([kind, c]) => `<marker id="ah-${kind}" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:${c}"/></marker>`).join('');
    let body = '';
    for (const a of list) {
      const ea = field.querySelector(`[data-hero="${a.from.p}-${a.from.k}"]`);
      const eb = field.querySelector(`[data-hero="${a.to.p}-${a.to.k}"]`);
      if (!ea || !eb) continue;
      const ra = ea.getBoundingClientRect(), rb = eb.getBoundingClientRect();
      let x1 = ra.left + ra.width / 2 - fr.left, y1 = ra.top + ra.height / 2 - fr.top;
      let x2 = rb.left + rb.width / 2 - fr.left, y2 = rb.top + rb.height / 2 - fr.top;
      const len = Math.hypot(x2 - x1, y2 - y1);
      if (len < 30) continue;
      const ux = (x2 - x1) / len, uy = (y2 - y1) / len;
      x1 += ux * 18; y1 += uy * 18; x2 -= ux * 22; y2 -= uy * 22;
      body += `<line class="${phase === 'respond' ? 'live' : ''}" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" style="stroke:${color[a.kind]}" marker-end="url(#ah-${a.kind})"/>`;
    }
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'arrows');
    svg.setAttribute('viewBox', `0 0 ${fr.width} ${fr.height}`);
    svg.setAttribute('aria-hidden', 'true');
    svg.innerHTML = `<defs>${defs}</defs>${body}`;
    field.appendChild(svg);
  }

  // 真ん中の帯：ラウンド・どちらのターンか・フェーズ・残り時間
  function turnLine(v, st) {
    const mine = v.active === 0;
    let ph, hot = false;
    if (phase === 'mine') ph = deadline ? '行動 <span class="tl-sec"></span>秒' : '行動';
    else if (phase === 'respond') { ph = '対応する？ <span class="tl-sec"></span>秒'; hot = true; }
    else if (phase === 'wait' && !st) { ph = '相手が対応を考え中'; hot = true; }
    else {
      const t = st ? st.title : '';
      ph = t.endsWith('のターン') ? 'ターン開始' : t.startsWith('攻撃の宣言') ? '攻撃の宣言' : t.startsWith('対応') ? '対応' : t === '終了' ? '試合終了' : '処理';
      hot = ph === '攻撃の宣言';
    }
    return `<div class="turnline ${phase === 'respond' ? 'respond' : mine ? 'me' : 'opp'}" role="status" aria-live="polite">
      <span class="tl-round">R${v.round}/${E.MAX_ROUND}</span>
      <span class="tl-who">${mine ? '▲ あなたのターン' : '▼ 相手のターン'}</span>
      <span class="tl-phase${hot ? ' hot' : ''}">${ph}</span>
      ${deadline ? '<i class="tl-bar"></i>' : ''}</div>`;
  }
  function turnBanner(st) {
    if (!st || !st.title.endsWith('のターン')) return '';
    const mine = st.view.active === 0;
    return `<div class="turnban ${mine ? 'me' : 'opp'}"><span>${mine ? 'あなたのターン' : '相手のターン'}</span><small>ラウンド${st.view.round}</small></div>`;
  }

  function manaHTML(n) {
    return `<span class="mana" aria-label="マナ ${n}"><span class="gems">${n > 0 ? '<i class="gem"></i>'.repeat(n) : '<i class="gem empty"></i>'}</span><b>${n}</b></span>`;
  }

  // 手札：ヒーローごとに2枚と、次に来るカード
  function handHTML() {
    const respOK = new Set(phase === 'respond' ? E.responses(game, 0).map((r) => r.uid) : []);
    const card = (c) => {
      const def = C[c.id];
      const usable = phase === 'mine'
        ? (def.target === 'none' ? !E.checkCard(game, 0, def, null) : [0, 1, E.TOWER].some((t) => !E.checkCard(game, 0, def, t)))
        : respOK.has(c.uid);
      const pressed = phase === 'respond' ? rsel === c.uid : sel === c.uid;
      const tag = def.resp ? '<span class="tag resp">対応</span>' : def.pos === 'front' ? '<span class="tag front">前衛</span>' : '';
      return `<button class="card c-${H[def.hero].color}${usable ? '' : ' off'}" aria-pressed="${pressed}" data-card="${c.uid}">
        <span class="ch"><span class="cost">${def.cost}</span>${tag}</span><b>${esc(def.name)}</b>${c.fresh ? '<span class="tag new">NEW</span>' : ''}</button>`;
    };
    return [0, 1].map((k) => {
      const h = me().heroes[k], d = me().decks[k];
      return `<div class="hgroup c-${H[h.id].color}${h.ko ? ' ko' : ''}">
        <span class="hg-head"><b>${H[h.id].name}</b><span class="hg-next">次：${esc(C[d.queue[0]].name)}</span></span>
        <div class="hg-cards">${d.hand.map(card).join('')}</div></div>`;
    }).join('');
  }

  // ── 説明欄とボタン ──
  function respondPanel() {
    const pd = game.pending;
    const atk = game.players[1].heroes[pd.k];
    const what = pd.type === 'card' ? `「${C[pd.id].name}」${C[pd.id].text}` : `「${H[atk.id].skill.name}」${H[atk.id].skill.text}`;
    const to = pd.target == null ? '' : ` → <b>${targetName(0, pd.target)}</b>`;
    const opts = E.responses(game, 0);
    let d = `<b class="h">相手の${H[atk.id].name}</b>${to}<br>${esc(what)}`;
    if (rsel) {
      const def = C[myCard(rsel).id];
      d += `<br><b class="h">${esc(def.name)}</b>【${def.cost}】${esc(def.text)}${def.target === 'ally' ? `<br>対象：${rtarget != null ? `<b>${H[me().heroes[rtarget].id].name}</b>` : '<span class="muted">緑に光っている味方をタップ</span>'}` : ''}`;
    } else {
      d += `<br><span class="muted">${opts.length ? '光っているカードか、下のボタンで対応できる' : '対応できるものがない'}</span>`;
    }
    const extra = opts.filter((r) => r.skill != null || r.block != null);
    // ブロックや「かばう」のボタンは、5秒の受付中に見落とさないよう一番上に出す
    if (extra.length) d = `<div class="acts" style="margin-top:0">${extra.map((r) => {
      if (r.block != null) return `<button class="mini solid" data-block="${r.block}">${H[me().heroes[r.block].id].name}でブロック</button>`;
      const h = me().heroes[r.skill];
      return `<button class="mini solid resp" data-respskill="${r.skill}">${H[h.id].name}の「${esc(H[h.id].skill.name)}」で対応</button>`;
    }).join('')}</div>` + d;
    const ready = rsel && (C[myCard(rsel).id].target !== 'ally' || rtarget != null);
    return {
      panel: `<div class="detail">${d}</div>`,
      buttons: `<button class="btn ghost" id="pass">対応しない</button><button class="btn" id="resp" ${ready ? '' : 'disabled'}>${rsel ? `「${esc(C[myCard(rsel).id].name)}」で対応` : 'カードを選ぶ'}</button>`,
    };
  }

  function minePanel(v) {
    let d, use = null;
    if (mode === 'skill' && focus) {
      const sk = H[me().heroes[focus.k].id].skill;
      const err = ptarget ? E.check(game, 0, { type: 'skill', k: focus.k, target: ptarget.k }) : '対象を選ぶ';
      d = `<b class="h">「${esc(sk.name)}」</b>${skillTag(sk)}${esc(sk.text)}<br>${ptarget ? `→ <b>${targetName(ptarget.p, ptarget.k)}</b>` : `<span class="muted">${sk.target === 'ally' ? '緑に光っている味方' : '狙う相手'}をタップ</span>`}`;
      use = `<button class="btn" id="use" ${err ? 'disabled' : ''}>${ptarget ? '使う' : '対象を選ぶ'}</button>`;
    } else if (sel) {
      const def = C[myCard(sel).id];
      const t = def.target === 'none' ? null : ptarget ? ptarget.k : undefined;
      const blocked = def.target === 'none' ? E.checkCard(game, 0, def, null) : currentTargets().length ? null : E.checkCard(game, 0, def, 0);
      const err = blocked || (t === undefined ? '対象を選ぶ' : E.checkCard(game, 0, def, t));
      d = `<b class="h">${esc(def.name)}</b>【${def.cost}${def.pos === 'front' ? '・前衛' : ''}】${esc(def.text)}`
        + (blocked ? `<br><span class="err">使えない：${esc(blocked)}</span>`
          : def.target === 'none' ? '' : ptarget ? `<br>→ <b>${targetName(ptarget.p, ptarget.k)}</b>` : `<br><span class="muted">${def.target === 'ally' ? '緑に光っている味方' : '狙う相手'}をタップ</span>`);
      use = `<button class="btn" id="use" ${err ? 'disabled' : ''}>${t === undefined && !blocked ? '対象を選ぶ' : '使う'}</button>`;
    } else if (focus) {
      d = focusHTML(v);
    } else {
      d = '<span class="muted">カードかヒーローをタップ。攻撃すると相手は対応してくるかもしれない。残したマナは相手のターンの対応に使える。</span>';
    }
    const busy = sel || mode || focus;
    return {
      panel: `<div class="detail">${d}</div>`,
      buttons: `<button class="btn ghost" id="cancel" ${busy ? '' : 'disabled'}>やめる</button>${use || '<button class="btn" id="endturn">ターン終了</button>'}`,
    };
  }

  // ヒーローかタワーの詳細（自分のヒーローならスキルと移動のボタン）
  function focusHTML(v) {
    if (focus.k === E.TOWER) {
      return `<b class="h">${focus.p === 0 ? 'あなた' : '相手'}のタワー</b>　HP ${Math.max(0, v.players[focus.p].tower)}/${E.TOWER_HP}<br><span class="muted">壊されたら負け。タワーへの攻撃は、前衛のヒーローがブロックして代わりに受けられる（前衛1人につき、相手のターンに1回）。前衛が空なら無防備。</span>`;
    }
    const h = v.players[focus.p].heroes[focus.k];
    if (focus.p === 1 && !h.revealed) return '<b class="h">正体不明の後衛</b><br><span class="muted">前衛に出るか、行動するか、ダメージを受けると正体が分かる。</span>';
    const def = H[h.id], sk = def.skill;
    let d = `<b class="h">${focus.p === 0 ? 'あなた' : '相手'}の${def.name}</b>　<span class="muted">${E.POS_NAME[h.pos]}</span>`;
    if (focus.p === 0 && phase === 'mine' && !h.ko) {
      const errs = (sk.target === 'ally' ? [0, 1] : [0, 1, E.TOWER]).map((t) => E.check(game, 0, { type: 'skill', k: focus.k, target: t }));
      const skErr = errs.every(Boolean) ? errs.find(Boolean) : null;
      const mvErr = E.check(game, 0, { type: 'move', k: focus.k });
      d += `<div class="acts">
        <button class="mini solid" id="skill" ${skErr ? 'disabled' : ''}>${esc(sk.name)}【${E.SKILL_COST}】${skErr ? `：${esc(skErr)}` : ''}</button>
        <button class="mini" id="move" ${mvErr ? 'disabled' : ''}>${h.pos === 'front' ? '後衛' : '前衛'}へ移動${mvErr ? `：${esc(mvErr)}` : ''}</button></div>`;
    }
    return d + heroListHTML(h.id);
  }

  function playPanel(st) {
    const head = phase === 'wait' && !st ? '相手が対応を考えている…' : st ? st.title : '';
    const lines = st ? st.lines : [];
    const lastStep = play && play.i === play.steps.length - 1;
    return {
      panel: `<div class="detail log"><div class="dh"><b>${esc(head)}</b>${play ? `<span class="muted">${play.i + 1} / ${play.steps.length}</span>` : ''}</div>
        ${lines.length ? `<ul>${lines.map((s) => s.startsWith('※') ? `<li class="why"><span class="whytag">なぜ</span>${esc(s.slice(1))}</li>` : `<li>${esc(s)}</li>`).join('')}</ul>` : ''}</div>`,
      buttons: play
        ? `<button class="btn ghost" id="skip" ${lastStep ? 'disabled' : ''}>最後まで</button><button class="btn" id="next">${lastStep ? (game.over ? '結果を見る' : '続ける') : '次へ'}</button>`
        : '<button class="btn ghost" disabled>…</button><button class="btn" disabled>相手を待っている</button>',
    };
  }

  // ── 描画 ──
  function render() {
    const st = play ? play.steps[play.i] : null;
    const v = st ? st.view : E.view(game);
    const ctx = { hits: st ? st.hits : [], actor: st ? st.actor : null, targets: currentTargets(), marks: boardMarks() };
    const row = (p, pos) => `<div class="frow">${[0, 1].map((k) => `<div class="cell">${v.players[p].heroes[k].pos === pos ? heroHTML(v, p, k, ctx) : `<span class="slot">${E.POS_NAME[pos]}</span>`}</div>`).join('')}</div>`;
    const { panel, buttons } = phase === 'respond' ? respondPanel() : phase === 'mine' ? minePanel(v) : playPanel(st);
    const showHand = phase === 'mine' || phase === 'respond';
    app.innerHTML = `<section class="screen battle${phase === 'respond' ? ' responding' : ''}" style="gap:4px">
      <div class="bar opp${v.active === 1 ? ' turn' : ''}"><span class="who">相手</span>${manaHTML(v.players[1].mana)}<span class="note">${v.active === 1 ? '' : '対応用のマナ'}</span></div>
      <div class="field ${v.active === 0 ? 'act-me' : 'act-opp'}">
        ${turnBanner(st)}
        ${towerHTML(v, 1, ctx)}
        ${row(1, 'back')}${row(1, 'front')}
        ${turnLine(v, st)}
        ${row(0, 'front')}${row(0, 'back')}
        ${towerHTML(v, 0, ctx)}
      </div>
      <div class="bar me${v.active === 0 ? ' turn' : ''}"><span class="who">あなた</span>${manaHTML(v.players[0].mana)}<span class="note">${v.active === 0 ? '' : '対応用のマナ'}</span></div>
      <div class="hand" ${showHand ? '' : 'hidden'}>${handHTML()}</div>
      ${panel}
      <div class="act">${buttons}</div>
    </section>`;
    paintClock();
    drawArrows(arrowList(st));
    bind();
  }

  function bind() {
    const on = (id, fn) => { const b = document.getElementById(id); if (b) b.onclick = fn; };
    on('next', advance);
    on('skip', skipAll);
    app.querySelectorAll('[data-hero]').forEach((el) => {
      const tap = () => {
        const [p, k] = el.dataset.hero.split('-').map(Number);
        const isTarget = currentTargets().some((t) => t.p === p && t.k === k);
        if (phase === 'respond') { if (isTarget) { rtarget = k; render(); } return; }
        if (phase !== 'mine') return;
        if (isTarget && (mode === 'skill' || sel)) { ptarget = { p, k }; return render(); }
        sel = null; mode = null; ptarget = null;
        focus = focus && focus.p === p && focus.k === k ? null : { p, k };
        render();
      };
      el.onclick = tap;
      el.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tap(); } };
    });
    app.querySelectorAll('[data-card]').forEach((b) => b.onclick = () => {
      const uid = +b.dataset.card;
      if (phase === 'respond') {
        if (!E.responses(game, 0).some((r) => r.uid === uid)) return;
        rsel = rsel === uid ? null : uid;
        // 盾や回復は、狙われた味方を初期の対象にする
        const def = rsel && C[myCard(rsel).id];
        const pd = game.pending;
        rtarget = def && def.target === 'ally' && (pd.target === 0 || pd.target === 1) && !me().heroes[pd.target].ko ? pd.target : null;
        return render();
      }
      if (phase !== 'mine') return;
      mode = null; focus = null; ptarget = null;
      sel = sel === uid ? null : uid;
      render();
    });
    app.querySelectorAll('[data-respskill]').forEach((b) => b.onclick = () => sendResponse({ skill: +b.dataset.respskill }));
    app.querySelectorAll('[data-block]').forEach((b) => b.onclick = () => sendResponse({ block: +b.dataset.block }));
    on('skill', () => { mode = 'skill'; ptarget = null; render(); });
    on('move', () => doMine({ type: 'move', k: focus.k }));
    on('use', () => {
      if (mode === 'skill' && focus) { if (ptarget) doMine({ type: 'skill', k: focus.k, target: ptarget.k }); return; }
      const def = C[myCard(sel).id];
      if (def.target === 'none') doMine({ type: 'card', uid: sel, target: null });
      else if (ptarget) doMine({ type: 'card', uid: sel, target: ptarget.k });
    });
    on('cancel', () => { clearPick(); render(); });
    on('endturn', endMyTurn);
    on('pass', () => sendResponse(null));
    on('resp', () => { if (rsel) sendResponse({ uid: rsel, target: rtarget }); });
  }

  function result() {
    stopTimers();
    const w = game.winner;
    const [head, cls] = w === 0 ? ['勝利', 'win'] : w === 1 ? ['敗北', 'lose'] : ['引き分け', ''];
    const o = document.createElement('div');
    o.className = 'overlay';
    o.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${head}">
      <h2 class="${cls}">${head}</h2>
      <p class="muted">${esc(game.endReason)}</p>
      <p>相手は <b>${esc(cpuTeam.label)}</b></p>
      <div class="foot"><button class="btn ghost" id="repick">ヒーローを選ぶ</button><button class="btn" id="again">もう一度</button></div></div>`;
    document.body.appendChild(o);
    o.querySelector('#again').focus();
    o.querySelector('#again').onclick = () => { o.remove(); start(); };
    o.querySelector('#repick').onclick = () => { o.remove(); pick(); };
  }

  title();
})();
</script>
